- baseInfo:
    api_name: 用户登陆2
    url: /api/user/login
    method: post
    header:
      Content-Type: application/json
  testCase:
    - case_name: 用户登陆失败密码错误
      json:
        username: cc
        password: 123
      validation:
        - contain: { "msg": "用户不存在" }
        - eq: { "msg": "用户不存在" }
        - code: 200
      extract:
        token: $.token
- baseInfo:
    api_name: 用户登陆3
    url: /api/user/login
    method: post
    header:
      Content-Type: application/json
  testCase:
    - case_name: 用户登陆失败账号错误
      json:
        username: cc111
        password: 123456
      validation:
        - contain: { "msg": "用户不存在" }
        - eq: { "msg": "用户不存在" }
        - code: 200
      extract:
        token: $.token


