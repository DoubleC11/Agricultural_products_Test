- baseInfo:
    api_name: 用户登陆
    url: /api/user/login
    method: post
    header:
      Content-Type: application/json
  testCase:
    - case_name: 用户正常登陆校验
      json:
        username: admin
        password: 123456
      validation:
        - code: 200
        - contain:
            msg: 成
        - eq:
            msg: 成功
        - ne:
            msg: 不成功
      extract:
        token: $.data.token
    - case_name: 用户异常登陆校验
      json:
        username: admin
        password: 123
      validation:
        #        - contain:
        - code: 200
      extract:
        token: $.data.token
    - case_name: 用户登陆失败账号错误
      json:
        username: cc111
        password: 123456
      validation:
        - contain: { "msg": "用户不存在" }
        - eq: { "msg": "用户不存在" }
        - code: 200




