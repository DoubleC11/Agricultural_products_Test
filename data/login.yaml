- baseInfo:
    api_name: 用户登陆1
    url: /api/user/login
    method: post
    header:
      Content-Type: application/json
  testCase:
    - case_name: 用户正常登陆校验
      json:
        username: admin
        password: 123456
      validation:
        - code: 200
        - contain:
            msg: 成
        - eq:
            msg: 成功
        - ne:
            msg: 不成功
      extract:
        token: $.data.token
